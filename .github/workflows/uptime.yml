name: Uptime Monitor

# Pemantau luaran untuk https://ubuntu.tukuk.org
#
# Mengapa di sini: mesin server TIDAK boleh menghidupkan dirinya sendiri bila
# mati luar kawalan (VM provider stop, blackout, kabel putus). Tiada apa-apa
# DALAM mesin boleh memberitahu sesiapa. GitHub Actions berjalan di luar
# mesin yang sama, jadi ia nampak downtime yang server sendiri tak nampak.
#
# Repo PUBLIC  -> cron percuma tanpa had.
# Had jujur:
#   - cron GitHub boleh berundur beberapa minit di bawah beban (bukan tepat 5min)
#   - workflow bertaurmatik DIMATIKAN selepas 60 hari tanpa aktiviti repo

on:
  schedule:
    # 2-59/5 = cadence 5-minit SAMA seperti */5, tetapi bermula :02 dan
    # MEMBUANG slot :00/:30. Sebab: ribuan workflow dunia tembak tepat pada
    # :00/:30; puncakan cluster cron GitHub lalu GitHub sanggup DROP run
    # ("In the worst case, the workflow may not run" - dokumentasi GitHub,
    # dan gelombang bug scheduler Ogos/Sep 2026 di community discussions).
    # Elak dua slot panas = peluang jauh lebih tinggi untuk benar-benar fire.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      force_fail:
        description: 'Uji jalur KEGAGALAN (buka issue tanpa mematikan laman)'
        type: boolean
        default: false

# contents:read sahaja utk kod; issues:write utk buka/tutup issue.
# Tiada scope tulis ke repo — monitor tak pernah mengubah kod.
permissions:
  contents: read
  issues: write

concurrency:
  group: uptime-monitor
  cancel-in-progress: false

jobs:
  probe:
    name: Periksa laman
    runs-on: ubuntu-latest
    # 5m dah tak cukup: probe (<=~160s kalau endpoint slow) + pengesahan luar
    # SEQUENTIAL (<=~2 langkah x 6x6s) + langkah gh. 8m beri margin selamat.
    timeout-minutes: 8

    steps:
      - name: Uji kedua-dua endpoint
        id: probe
        env:
          # Force-fail hanya untuk ujian jalur kegagalan; schedule = kosong = false
          FORCE_FAIL: ${{ inputs.force_fail || false }}
        run: |
          set -uo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          details=""
          ok=true
          # http_fail=bertulis bila mana-mana endpoint gagal dgn kod HTTP
          # bukan-200 (403/5xx/000). Pembeza penting:
          #   - kegagalan rangkaian/kod -> boleh disemak oleh nod luar (fallback)
          #   - kandungan rosak (200 tanpa penanda) -> masalah SEBENAR di origin,
          #     nod luar tak dapat kesan (mereka hanya nampak kod) -> jangan fallback.
          http_fail=false
          # content_fail=200 tapi penanda hilang -> origin rosak. Nod luar
          # hanya nampak KOD (mereka akan nampak 200 = sihat), jadi fallback
          # TIDAK boleh digunakan untuk memaafkan kegagalan jenis ni.
          content_fail=false

          # Simpan header respons supaya KEKAL boleh didiagnosis kemudian.
          # Berguna bila dapat 403/5xx: 'server: cloudflare' + 'cf-mitigated'
          # membuktikan Cloudflare yang menyekat (bukan origin kita).
          # Amsal: TAMBAH pada $details (bukan echo ke log sahaja) supaya
          # bukti kekal dalam badan issue, bukan hilang dalam log run.
          dump_headers() {
            # $1 = fail header
            [ -f "$1" ] || return 0
            local srv mt ray
            # || true WAJIB: GitHub menjalankan step sebagai `bash -e {0}`,
            # jadi walaupun skrip ini hanya menulis `set -uo pipefail`,
            # errexit TETAP aktif. grep tanpa match keluar=1 + pipefail ->
            # assignment gagal -> skrip mati SENYAP sebelum sempat buka issue.
            # (Senario sebenar: 502 origin tanpa cf-mitigated, atau header
            #  ters.catat separuh bila cloudflared mati.)
            srv=$(grep -i '^server:' "$1" | head -1 | tr -d '\r' || true)
            mt=$(grep -i '^cf-mitigated:' "$1" | head -1 | tr -d '\r' || true)
            ray=$(grep -i '^cf-ray:' "$1" | head -1 | tr -d '\r' || true)
            [ -n "$srv" ] && details="${details}    ${srv}\n"
            [ -n "$mt" ]  && details="${details}    ${mt}\n"
            [ -n "$ray" ] && details="${details}    ${ray}\n"
            if [ -n "$srv" ] && echo "$srv" | grep -qi cloudflare; then
              details="${details}    -> 403/5xx ini DATANG DARI CLOUDFLARE, bukan origin.\n"
              details="${details}    -> origin TIDAK mencatat request ini dalam nginx access.log.\n"
            fi
          }

          # 1) Muka depan: mesti 200 DAN mengandungi penanda hero.
          #    200 kosong / 404 / 502 semuanya dianggap gagal.
          code=$(curl -sS -D /tmp/home.hdr -o /tmp/home.html -w '%{http_code}' \
                 --max-time 25 --retry 2 --retry-delay 3 \
                 -A "$UA" https://ubuntu.tukuk.org/ || echo 000)
          if [ "$code" != "200" ]; then
            ok=false; http_fail=true
            details="${details}muka depan HTTP=${code}\n"
            dump_headers /tmp/home.hdr
          elif ! grep -q "Turn your idea into an app" /tmp/home.html; then
            ok=false; content_fail=true
            details="${details}muka depan 200 TETAPI penanda hero hilang (kandungan rosak/bukan laman kita)\n"
          else
            echo "  ✓ muka depan: 200 + penanda hero"
          fi

          # 2) API proxy: mesti 200 dan mempunyai medan "source".
          #    Ini menguji rantai nginx -> proxy:3000 -> ollama yang
          #    muka depan SAHAJA tak dapat kesan (laman statik boleh hidup
          #    sementara AI sudah mati).
          apicode=$(curl -sS -D /tmp/api.hdr -o /tmp/api.json -w '%{http_code}' \
                 --max-time 25 --retry 2 --retry-delay 3 \
                 -A "$UA" https://ubuntu.tukuk.org/api/ollama/api/tags || echo 000)
          if [ "$apicode" != "200" ]; then
            ok=false; http_fail=true
            details="${details}API tags HTTP=${apicode}\n"
            dump_headers /tmp/api.hdr
          elif ! grep -q '"source"' /tmp/api.json; then
            ok=false; content_fail=true
            details="${details}API tags 200 tetapi medan source hilang\n"
          else
            echo "  ✓ API tags: 200 + source=$(grep -o '"source":"[^"]*"' /tmp/api.json)"
          fi

          # 3) Ujian jalur kegagalan (workflow_dispatch sahaja)
          if [ "$FORCE_FAIL" = "true" ]; then
            ok=false
            details="${details}UJIAN: force_fail=true (dipaksa gagal utk uji alert)\n"
            echo "  ⚠ force_fail aktif — akan membuka issue"
          fi

          if [ "$ok" = "true" ]; then
            echo "result=ok" >> "$GITHUB_OUTPUT"
            echo "  KEPUTUSAN: SIHAT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
            printf "  KEPUTUSAN: GAGAL\n  %b" "$details"
          fi
          {
            echo "details<<DETAILS_EOF"
            printf "%b" "$details"
            echo "DETAILS_EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "http_fail=$http_fail"
            echo "content_fail=$content_fail"
          } >> "$GITHUB_OUTPUT"

      # Keputusan MUKTAMAD: ok = tutup issue, fail = buka/komen issue,
      # hold = jangan sentuh issue (ketidakpastian -> elak flap buka/tutup).
      #
      # Kenapa perlu lapisan ni: Cloudflare sering menyekat IP datacenter
      # runner GitHub (403 dua-dua endpoint) WALAU site sihat penuh — bukti:
      # curl dari server ni (UA sama) dapat 200, access.log tiada langsung
      # log masuk pada masa yang sama. Tanpa pengesahan luar, setiap run jadi
      # alert palsu setiap 5 minit.
      - name: Keputusan akhir (+ pengesahan luar bila disekat)
        id: decide
        env:
          PROBE_RESULT: ${{ steps.probe.outputs.result }}
          HTTP_FAIL: ${{ steps.probe.outputs.http_fail }}
          CONTENT_FAIL: ${{ steps.probe.outputs.content_fail }}
          FORCE_FAIL: ${{ inputs.force_fail || false }}
          PROBE_DETAILS: ${{ steps.probe.outputs.details }}
        run: |
          set -uo pipefail
          out() {
            # $1 = result, $2 = note (teks tambahan utk issue/tutup)
            echo "result=$1" >> "$GITHUB_OUTPUT"
            echo "note=$2" >> "$GITHUB_OUTPUT"
            {
              echo "details<<DETAILS_EOF"
              # PUNCA BUG DIUJI SEBENAR: GitHub menyimpan nilai output
              # heredoc TANPA newline di hujung (parser pecah kpd baris,
              # sambung semula dgn \n). Jadi kalau kita tulis balik nilai
              # itu dgn `printf "%b"` sahaja, hujungnya tiada \n ->
              # `DETAILS_EOF` melekat pada baris terakhir ->
              # runner gagal: "Matching delimiter not found" (step merah).
              # Fix: $(...) buang semua \n hujung, `\n` tambah tepat SATU.
              printf '%s\n' "$(printf "%b" "$PROBE_DETAILS")"
              echo "DETAILS_EOF"
            } >> "$GITHUB_OUTPUT"
          }

          if [ "$PROBE_RESULT" = "ok" ]; then
            out ok ""
            echo "  ✓ probe sihat — tiada semakan luar diperlukan"
            exit 0
          fi
          if [ "$FORCE_FAIL" = "true" ]; then
            out fail ""
            echo "  ⚠ force_fail — laluan alert diuji, fallback dimatikan"
            exit 0
          fi
          if [ "$CONTENT_FAIL" = "true" ]; then
            out fail ""
            echo "  ⚠ kandungan rosak (kod 200, penanda hilang) — masalah origin; nod luar tak dapat kesan (mereka nampak 200)"
            exit 0
          fi
          if [ "$HTTP_FAIL" != "true" ]; then
            out fail ""
            echo "  ⚠ gagal tanpa kod HTTP (tidak dijangka) — terus alert"
            exit 0
          fi

          # Probe gagal dgn kod bukan-200 -> tanya nod luar (check-host.net,
          # percuma tanpa API key) dari 3 negara berbeza. python3: tiada jq
          # diperlukan; dua URL disemak serentak (~36s, jauh bawah timeout 5m).
          VHOME=INCONCLUSIVE VAPI=INCONCLUSIVE
          if vals=$(python3 - https://ubuntu.tukuk.org/ https://ubuntu.tukuk.org/api/ollama/api/tags <<'PY'
          import json, sys, time, urllib.request, urllib.parse

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          def get(url, tries=3):
              # check-host.net ada rate-limit utk IP tanpa daftar. Ujian
              # sebenar: 2 check serentak dari IP runner -> satu gagal ->
              # VAPI=INCONCLUSIVE (log run 35775994248). Retry + backoff.
              err = None
              for i in range(tries):
                  try:
                      req = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": UA})
                      with urllib.request.urlopen(req, timeout=20) as r:
                          return json.load(r)
                  except Exception as e:
                      err = e
                      time.sleep(3 + 3 * i)
              raise err

          def verdict(url):
              # UP: sekurang-kurangnya satu nod dpt 200.
              # DOWN: nod selesai menyemak tapi tiada 200 (kod 5xx/4xx ATAU
              #       semua nod gagal sambung -> origin tak dapat dicapai).
              # INCONCLUSIVE: API check-host gagal/ belum selesai -> jangan
              #       buka DAN jangan tutup issue secara buta.
              try:
                  q = urllib.parse.quote(url, safe="")
                  rid = get("https://check-host.net/check-http?host=" + q + "&max_nodes=3")["request_id"]
              except Exception:
                  return "INCONCLUSIVE"
              res = None
              for _ in range(5):
                  time.sleep(6)
                  try:
                      res = get("https://check-host.net/check-result/" + rid)
                  except Exception:
                      return "INCONCLUSIVE"
                  if res and all(v is not None for v in res.values()):
                      break
              if not res:
                  return "INCONCLUSIVE"
              codes, pending, errs = [], False, 0
              for entries in res.values():
                  if entries is None:
                      pending = True
                      continue
                  for e in entries:
                      if isinstance(e, dict):
                          errs += 1
                      elif len(e) > 3:
                          codes.append(str(e[3]))
              if any(c == "200" for c in codes):
                  return "UP"
              if pending:
                  return "INCONCLUSIVE"
              if codes or errs:
                  return "DOWN"
              return "INCONCLUSIVE"

          # SEQUENTIAL dgn sengaja: 2 check serentak dari IP runner kena
          # rate-limit (bukti: run 35775994248, VAPI=INCONCLUSIVE).
          v = [verdict(sys.argv[1]), verdict(sys.argv[2])]
          print("VHOME=" + v[0])
          print("VAPI=" + v[1])
          PY
          ); then
            eval "$(printf '%s\n' "$vals" | grep -E '^(VHOME|VAPI)=')"
          fi
          echo "  semakan nod luar: muka depan=$VHOME API=$VAPI"

          ext="Semakan nod luar (3 negara): muka depan=$VHOME, API=$VAPI\n"
          if [ "$VHOME" = "UP" ] && [ "$VAPI" = "UP" ]; then
            PROBE_DETAILS="${PROBE_DETAILS}${ext}-> Site SIHAT menurut nod luar; runner GitHub disekat (false positive).\n"
            out ok "Site disahkan SIHAT oleh nod luar dari 3 negara. Kegagalan pada pemeriksaan ini ialah runner GitHub disekat Cloudflare, bukan downtime."
            echo "::warning::Runner disekat (kod bukan-200) tetapi nod luar nampak site SIHAT — tiada issue dibuka."
          elif [ "$VHOME" = "DOWN" ] || [ "$VAPI" = "DOWN" ]; then
            PROBE_DETAILS="${PROBE_DETAILS}${ext}-> Disahkan DOWN oleh nod luar (bukan sekatan runner sahaja).\n"
            out fail ""
          else
            # Ketidakpastian: jangan tutup issue outage yang mungkin sah,
            # jangan buka duplikat. Run jadi neutral + warning sahaja.
            out hold ""
            echo "::warning::Probe gagal tetapi pengesahan luar INCONCLUSIVE — isu tidak diubah (tiada bukti cukup)."
          fi

      - name: Buka issue bila DOWN
        if: steps.decide.outputs.result == 'fail'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DETAILS: ${{ steps.decide.outputs.details }}
        run: |
          set -uo pipefail
          # --repo WAJIB: job ini tiada actions/checkout, jadi gh tak dapat
          # kesan repo dari remote git. Tanpa flag ni, gh gagal dengan
          # "fatal: not a git repository" dan TIADA issue terbuka langsung.
          gh label create outage --color B60205 \
            --description 'Laman tidak dapat diakses' \
            --repo "$GITHUB_REPOSITORY" --force

          TITLE='🔴 ubuntu.tukuk.org TIDAK DAPAT DIAKSES'
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                     --limit 200 --json title \
                     --jq "[.[] | select(.title == \"${TITLE}\")] | length" 2>/dev/null || echo "?")
          echo "  bilangan issue sedia ada: ${existing}"

          # Jika existing='?' bermakna query gagal — JANGAN buka duplikat buta.
          if [ "$existing" = "?" ]; then
            echo "::warning::Gagal menyemak issue sedia ada — langkah dibatalkan utk elak duplikat"
            exit 1
          fi

          if [ "$existing" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --label outage \
              --body "$(printf 'Laman **tidak dapat diakses**.\n\n## Butiran kegagalan\n```\n%b```\n\n## Siasatan pertama di server\n```bash\nsystemctl status nginx cloudflared ollama promptcraft-proxy\njournalctl -u nginx -u cloudflared -n 100\n```\n\nFail run: %s\n\n_Issue ini dibuka automatik oleh Uptime Monitor._' \
                "$DETAILS" \
                "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
            echo "  ✓ ISSUE BARU dibuka"
          else
            gh issue comment --repo "$GITHUB_REPOSITORY" \
              --body "$(printf 'Masih **DOWN** pada pemeriksaan seterusnya.\n```\n%b```\nFail: %s' \
                "$DETAILS" \
                "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")" \
              "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
                  --json number,title \
                  --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -1)"
            echo "  ▲ issue sedia ada — KOMEN ditambah (tak membuka duplikat)"
          fi

      - name: Tutup issue bila PULIH
        if: steps.decide.outputs.result == 'ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTE: ${{ steps.decide.outputs.note }}
        run: |
          set -uo pipefail
          TITLE='🔴 ubuntu.tukuk.org TIDAK DAPAT DIAKSES'
          # NOTE kosong = pulih biasa; NOTE berisi = pulih disahkan nod luar
          # (runner disekat Cloudflare tetapi site hidup dari negara lain).
          CLOSE_NOTE="${NOTE:-✅ PULIH — pemeriksaan seterusnya lulus kedua-dua endpoint.}"
          # || true: gh boleh gagal sementara (rangkaian); jangan bunuh job
          # sihat dgn -e. Kosong -> dianggap tiada issue -> cuba lagi pusingan
          # seterusnya (self-healing, tiada alert palsu merah).
          nums=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
                 --json number,title \
                 --jq ".[] | select(.title == \"${TITLE}\") | .number" || true)
          if [ -z "$nums" ]; then
            echo "  ✓ sihat, tiada issue outage terbuka"
          else
            for n in $nums; do
              gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
                --comment "$CLOSE_NOTE"
              echo "  ✓ issue #${n} ditutup automatik"
            done
          fi
