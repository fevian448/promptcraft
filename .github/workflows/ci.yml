name: CI

# Kunci rahsia: baca sahaja. Workflow ni tak pernah menulis ke repo,
# jadi ia tak perlukan GITHUB_TOKEN scope tulis langsung.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Elakkan pembaziran minit: bila ada push baharu, batal run lama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & uji
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sintaks JS (node --check)
        run: |
          set -euo pipefail
          for f in app.js chips.js zip.js site-config.js i18n.js proxy/server.js worker/worker.js tests/zip.test.js tests/dom-refs.test.js tests/i18n.test.js; do
            if [ ! -f "$f" ]; then
              echo "::error::fail hilang: $f"
              exit 1
            fi
            node --check "$f"
            echo "  OK  $f"
          done

      - name: Uji ZipUtil (CRC32 + struktur arkib)
        run: node tests/zip.test.js

      - name: Uji rujukan DOM (index.html <-> app.js)
        run: node tests/dom-refs.test.js

      - name: Uji i18n (semua kunci wujud dalam semua bahasa)
        run: node tests/i18n.test.js

      - name: Struktur HTML (tiada tag tak tertutup)
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          VOID = {"meta","link","br","hr","img","input","source","area",
                  "base","col","embed","track","wbr"}
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.stack=[]; self.bad=[]
              def handle_starttag(self,t,a):
                  if t not in VOID: self.stack.append(t)
              def handle_endtag(self,t):
                  if self.stack and self.stack[-1]==t: self.stack.pop()
                  elif t in self.stack: self.bad.append("tak sepadan: "+t)
                  else: self.bad.append(" lebih </%s>"%t)
          p=P(); p.feed(open("index.html",encoding="utf-8").read())
          assert not p.stack, "tag tak tertutup: "+", ".join(p.stack)
          assert not p.bad, "masalah tag: "+", ".join(p.bad)
          print("✓ index.html — semua tag tertutup dengan betul")
          PY

      - name: "Kunci rahsia — gagalkan jika key / IC / telefon masuk repo"
        run: |
          set -uo pipefail
          # Pola GENERIC supaya fail workflow ni sendiri TIDAK mengandungi
          # nilai sebenar (takdedahkan IC/telefon pemilik dalam repo).
          PATTERNS='ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|gho_[A-Za-z0-9]{20,}|ghu_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{20}|gsk_[A-Za-z0-9]{20}|csk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}|\b[0-9]{12}\b|\+60[0-9]{8,10}\b'
          if git grep -nEI "$PATTERNS" -- . ; then
            echo "::error::RAHSIA TERDETEKSI dalam repo. Jangan commit key/IC/telefon."
            exit 1
          fi
          echo "✓ tiada API key, nombor IC atau telefon dalam repo"
